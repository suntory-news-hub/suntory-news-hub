name: Update News

# 手動実行 + 毎朝 6:47（日本時間）に自動実行
# 毎時00分はGitHub Actionsが混雑するため47分にずらしている
on:
  workflow_dispatch:
  schedule:
    - cron: "47 21 * * *"   # UTC 21:47 = JST 6:47（毎日）

permissions:
  contents: write

concurrency:
  group: update-news
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r scraper/requirements.txt

      - name: Run scraper
        run: python scraper/main.py

      - name: Commit and push if changed
        run: |
          if [[ -n "$(git status --porcelain docs/data/news.json)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add docs/data/news.json
            git commit -m "Auto-update news.json"
            git push
          else
            echo "No changes."
          fi
