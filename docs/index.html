<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>Suntory News Hub</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header>
  <div class="container head">
    <div>
      <h1 translate="no">Suntory News Hub</h1>
      <div class="subtitle">サントリーグループ関連ニュース｜非公式まとめ</div>
    </div>
    <div class="meta" id="updateMeta">読み込み中…</div>
  </div>
</header>

<main class="container">
  <div class="sort-switch" role="tablist" aria-label="並び順">
    <button class="sort-btn active" data-sort="wellness">💚 ウエルネス優先</button>
    <button class="sort-btn" data-sort="date">🕒 新着順</button>
  </div>

  <div class="controls">
    <input type="search" id="searchInput" placeholder="キーワード検索（セサミン、CM、決算…）">

    <div class="filter-row">
      <span class="filter-label">事業</span>
      <div class="chips" id="segmentChips"></div>
    </div>
    <div class="filter-row">
      <span class="filter-label">トピック</span>
      <div class="chips" id="topicChips"></div>
    </div>
    <div class="filter-row">
      <span class="filter-label">期間</span>
      <div class="chips" id="periodChips"></div>
    </div>
    <div class="filter-row">
      <span class="filter-label">表示</span>
      <div class="chips" id="viewChips"></div>
    </div>
  </div>

  <div class="stats-bar">
    <span id="resultCount"></span>
    <a href="#" id="exportLink">📥 メモをエクスポート</a>
  </div>

  <div id="newsList"></div>
  <button id="loadMoreBtn" class="load-more" hidden>もっと見る</button>

  <footer>
    Google Newsの見出しとリンクを自動収集しています（毎朝更新）。記事の内容・権利は各媒体に帰属します。本サイトはサントリーグループとは関係ありません。
  </footer>
</main>

<script src="js/app.js"></script>
</body>
</html>
